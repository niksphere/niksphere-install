name: Cleanup Old Insider Releases and Packages

on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (only log what would be deleted)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Release Cleanup Script
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const script = require('./.github/scripts/cleanup-releases.js');
            const dryRun = ${{ github.event.inputs.dry_run || 'false' }};
            await script({ github, context, core }, dryRun);

      - name: Run Package Cleanup Script
        uses: actions/github-script@v9
        env:
          # Packages (e.g. niksphere-cloud, niksphere-engine) are owned by other
          # repositories in the org, so the default GITHUB_TOKEN (repo-scoped) cannot
          # manage them. NIKSPHERE_PAT must be an org-wide PAT with read/delete:packages
          # scope (classic) or Organization > Packages: Read and write (fine-grained).
          GITHUB_TOKEN: ${{ secrets.NIKSPHERE_PAT || secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.NIKSPHERE_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const script = require('./.github/scripts/cleanup-packages.js');
            const dryRun = ${{ github.event.inputs.dry_run || 'false' }};
            await script({ github, context, core }, dryRun);

      - name: Trigger Releases Update
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering update-releases.yml workflow to sync releases.json..."
          gh workflow run update-releases.yml --repo "${{ github.repository }}" --ref main || true
