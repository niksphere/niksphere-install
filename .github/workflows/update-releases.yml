name: Update Releases

on:
  release:
    types: [published, edited, prereleased]
  workflow_dispatch:

concurrency:
  group: update-releases
  cancel-in-progress: false

jobs:
  update-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch Release Data
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching all releases from repository..."
          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" > releases_list.json

      - name: Update releases.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node -e '
            const run = async () => {
              const fs = require("fs");
              const releases = JSON.parse(fs.readFileSync("releases_list.json", "utf8"));
              
              if (!Array.isArray(releases)) {
                console.error("Error: Invalid releases list retrieved.");
                process.exit(1);
              }
              
              const manifest = {
                channels: {
                  stable: {},
                  insider: {}
                }
              };

              const headers = {};
              if (process.env.GH_TOKEN) {
                headers["Authorization"] = `token ${process.env.GH_TOKEN}`;
              }

              for (const release of releases) {
                if (release.draft) continue;

                const manifestAsset = release.assets ? release.assets.find(a => a.name === "manifest.json") : null;
                if (!manifestAsset) continue;

                try {
                  const res = await fetch(manifestAsset.browser_download_url, { headers });
                  if (!res.ok) {
                    console.error(`Failed to fetch manifest.json for ${release.tag_name}: HTTP ${res.status}`);
                    continue;
                  }
                  const manifestJson = await res.json();
                  
                  const channel = release.prerelease ? "insider" : "stable";
                  if (!manifest.channels[channel]) {
                    manifest.channels[channel] = {};
                  }

                  for (const [rawKey, entry] of Object.entries(manifestJson)) {
                    const component = rawKey.replace(/^niksphere-/, "");

                    if (!manifest.channels[channel][component]) {
                      manifest.channels[channel][component] = [];
                    }

                    // Resolve relative download URLs to full browser_download_url
                    if (entry.downloads && typeof entry.downloads === "object") {
                      for (const [targetKey, targetVal] of Object.entries(entry.downloads)) {
                        if (targetVal && typeof targetVal === "object") {
                          const url = targetVal.url || "";
                          if (url && !url.startsWith("http://") && !url.startsWith("https://")) {
                            const asset = release.assets.find(a => a.name === url || a.name.endsWith(url));
                            targetVal.url = asset ? asset.browser_download_url : `https://github.com/${process.env.GITHUB_REPOSITORY || "niksphere/niksphere-install"}/releases/download/${release.tag_name}/${url}`;
                            if ((!targetVal.size || targetVal.size === 0) && asset) {
                              targetVal.size = asset.size;
                            }
                          }
                        }
                      }
                    }

                    // Resolve relative docs URLs to full browser_download_url
                    if (entry.docs && typeof entry.docs === "object") {
                      for (const [docKey, docVal] of Object.entries(entry.docs)) {
                        if (typeof docVal === "string" && docVal && !docVal.startsWith("http://") && !docVal.startsWith("https://")) {
                          const asset = release.assets.find(a => a.name === docVal || a.name.endsWith(docVal));
                          entry.docs[docKey] = asset ? asset.browser_download_url : `https://github.com/${process.env.GITHUB_REPOSITORY || "niksphere/niksphere-install"}/releases/download/${release.tag_name}/${docVal}`;
                        }
                      }
                    }

                    // Ensure published_at is present
                    if (!entry.published_at) {
                      entry.published_at = release.published_at || new Date().toISOString();
                    }

                    manifest.channels[channel][component].push(entry);
                  }
                } catch (err) {
                  console.error(`Error processing manifest for ${release.tag_name}:`, err);
                }
              }

              // Sort releases chronologically descending
              for (const ch in manifest.channels) {
                const channelObj = manifest.channels[ch];
                for (const comp in channelObj) {
                  channelObj[comp].sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
                }
              }

              fs.writeFileSync("releases.json", JSON.stringify(manifest, null, 2));
              console.log("releases.json successfully rebuilt from release manifests.");
            };
            run().catch(e => { console.error(e); process.exit(1); });
          '

      - name: Commit and Push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add releases.json
          
          if git diff --cached --quiet; then
            echo "No changes made to releases.json."
          else
            git commit -m "chore: update releases.json for release"
            git push origin main
            
            echo "Triggering GitHub Pages deployment workflow..."
            gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
          fi
